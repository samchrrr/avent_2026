name: Notif du matin

on:
  schedule:
    # 6h45 UTC = 7h45 à Paris. GitHub peut avoir quelques minutes de retard,
    # donc la notif arrive en général vers 8h.
    - cron: "45 6 29,30 11 *"   # compte à rebours : J-2 et J-1
    - cron: "45 6 1-24 12 *"    # les 24 cases
  workflow_dispatch:
    inputs:
      jour:
        description: "Numéro de la case à envoyer (pour tester : 1 à 24)"
        required: true
        default: "1"

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer la notification ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
          JOUR_MANUEL: ${{ github.event.inputs.jour }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC:-}" ]; then echo "Secret NTFY_TOPIC manquant"; exit 1; fi

          # Adresse du site : variable SITE_URL, sinon l'adresse GitHub Pages du dépôt
          if [ -z "${SITE_URL:-}" ]; then
            OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
            SITE_URL="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          SITE_URL="${SITE_URL%/}"

          envoyer() { # titre, message, lien, image (facultative)
            jq -n --arg topic "$NTFY_TOPIC" --arg title "$1" --arg msg "$2" --arg click "$3" --arg attach "${4:-}" \
              '{topic:$topic,title:$title,message:$msg,click:$click,priority:4}
               + (if $attach != "" then {attach:$attach,filename:"case.jpg"} else {} end)' > payload.json
            cat payload.json
            curl -sS --fail -H "Content-Type: application/json" -d @payload.json https://ntfy.sh/
          }

          MOIS=$(TZ=Europe/Paris date +%-m); JOUR=$(TZ=Europe/Paris date +%-d)

          # ---- Compte à rebours de fin novembre ----
          if [ -z "${JOUR_MANUEL:-}" ] && [ "$MOIS" = "11" ]; then
            case "$JOUR" in
              29) envoyer "⏳ J-2 avant ton calendrier de l'Avent" \
                          "Encore deux nuits… 24 lettres t'attendent sous leurs cachets de cire." "$SITE_URL/" ;;
              30) envoyer "🌙 J-1 : demain, la première lettre" \
                          "Dernière nuit avant d'ouvrir la case n°1. Fais de beaux rêves ♥" "$SITE_URL/" ;;
              *)  echo "Rien à envoyer aujourd'hui" ;;
            esac
            exit 0
          fi

          # ---- Les 24 cases ----
          if [ -n "${JOUR_MANUEL:-}" ]; then
            JOUR="$JOUR_MANUEL"
          elif [ "$MOIS" != "12" ] || [ "$JOUR" -gt 24 ]; then
            echo "Pas de case aujourd'hui"; exit 0
          fi

          TITRES=(
            "🎁 Case n°%s : ton petit mot t'attend"
            "💌 Psst… la case n°%s vient de s'ouvrir"
            "✨ Bonjour toi ! Case n°%s"
            "🎄 Un nouveau mot rien que pour toi (case n°%s)"
          )
          if [ "$JOUR" = "24" ]; then
            TITRE="⭐ Case n°24 : c'est le grand jour !"
          else
            TITRE=$(printf "${TITRES[$(( JOUR % ${#TITRES[@]} ))]}" "$JOUR")
          fi
          IMG=$(printf "%s/notif/jour-%02d.jpg" "$SITE_URL" "$JOUR")
          envoyer "$TITRE" "Touche ici pour ouvrir ta case du jour" "$SITE_URL/?jour=$JOUR" "$IMG"